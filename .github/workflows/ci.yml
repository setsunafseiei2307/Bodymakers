name: CI

on:
  push:
    branches: ['**']
  pull_request:

# 同じブランチで新しいpushがあったら古い実行は打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 型チェック・テスト・ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: ユニットテスト
        run: npm test

      - name: 本番ビルド
        run: npm run build:fast
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://bodymakers.example.com' }}

      - name: サイト内リンクの検査
        run: npm run check:links

      - name: ビルド成果物の保存
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
